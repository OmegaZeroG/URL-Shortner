name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fails the build only on high/critical vulnerabilities — moderate/low
      # findings are common in transitive deps and shouldn't block every PR,
      # but a known-exploitable high-severity dependency should.
      - run: npm audit --audit-level=high

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Informational, not blocking: the current finding is a Vite dev-server
      # only vulnerability (doesn't affect the production build) whose full
      # fix requires a breaking major Vite version bump — worth doing as its
      # own tested change, not force-applied inside a CI step.
      - run: npm audit --audit-level=high || true

  deploy:
    name: Deploy (Render + Vercel)
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (backend)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Trigger Vercel deploy hook (frontend)
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
