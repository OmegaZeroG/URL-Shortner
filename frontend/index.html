<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shorten any URL, add a custom alias, and track every click with real-time analytics — device, browser, country, and referrer breakdowns."
    />
    <title>trim.link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the weights actually used across the app are loaded — checked via
      a grep for font-bold/font-semibold/font-medium/italic usage rather than
      assumed. DM Sans: 400/500/600 (no bold DM Sans anywhere, no italic
      anywhere). Space Grotesk: 600/700 (its h3 headings use semibold, its
      h1/logo uses bold — 500 was unused). JetBrains Mono: 400/700 (plain
      short codes/results are 400; the one bold analytics heading needs 700,
      which the original loading was actually missing — 500/600 were never
      used with font-mono anywhere).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
